<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos - Resumen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <aside>
        <h2>Control de Gastos</h2>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="movimientos.html">Movimientos</a></li>

    <main>
        <header>
            <span>Resumen Financiero</span>

        <section class="resumen-container">

                <p class="monto">$ 3.450.800</p>
            </div>


            <div class="card">
                <h3>Ingresos Totales</h3>

                <p class="monto texto-gasto">$ 1.749.000</p>

        <section class="grafico-container">
            <h3>Distribución de Gastos por Categoría</h3>
            <!-- Aquí se puede agregar un gráfico con librerías como Chart.js -->
            <canvas id="grafico-gastos"></canvas>
