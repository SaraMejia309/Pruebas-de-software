<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos - Resumen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <aside>
        <h2>Control de Gastos</h2>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="movimientos.html">Movimientos</a></li>
            <li><a href="buscar.html">Buscar</a></li>
            <li class="active"><a href="resumen.html">Resumen</a></li>
        </ul>
    </aside>

    <main>
        <header>
            <span>Resumen Financiero</span>
        </header>

        <section class="tarjetas-container">
            <div class="card">
                <h3>Saldo Disponible</h3>
                <p class="monto" id="monto-saldo">$ 0</p>
            </div>
            <div class="card">
                <h3>Ingresos Totales</h3>
                <p class="monto texto-ingreso" id="monto-ingresos">$ 0</p>
            </div>
            <div class="card">
                <h3>Gastos Totales</h3>
                <p class="monto texto-gasto" id="monto-gastos">$ 0</p>
            </div>
        </section>

        <section>
            <h3>Gastos por Categoría</h3>
            <div id="contenedor-resumen" class="tarjetas-container">
                <!-- Se llena dinámicamente con JS -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
