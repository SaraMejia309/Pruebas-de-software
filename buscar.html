<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos - Buscar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <aside>
        <h2>Control de Gastos</h2>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="movimientos.html">Movimientos</a></li>
            <li class="active"><a href="buscar.html">Buscar</a></li>
            <li><a href="resumen.html">Resumen</a></li>
        </ul>
    </aside>

    <main>
        <header>
            <span>Buscar Movimientos</span>
        </header>

        <section>
    <h3>Buscar y Filtrar Movimientos</h3>
    
    <div style="display: flex; gap: 15px; margin-bottom: 20px;">
        <!-- Selector 1: Tipo de transacción -->
        <div class="form-group" style="flex: 1;">
            <label for="filtro-tipo-buscar">Tipo de Transacción</label>
            <select id="filtro-tipo-buscar">
                <option value="">Todos los tipos</option>
                <option value="gasto">Gastos</option>
                <option value="ingreso">Ingresos</option>
            </select>
        </div>

        <!-- Selector 2: Categorías (se llena según el Tipo) -->
        <div class="form-group" style="flex: 1;">
            <label for="filtro-categoria-buscar">Categoría</label>
            <select id="filtro-categoria-buscar">
                <option value="">Todas las Categorías</option>
            </select>
        </div>
    </div>

    <h3>Resultados de la Búsqueda</h3>
    <table>
        <thead>
            <tr>
                <th>Categoría</th>
                <th>Fecha</th>
                <th>Descripción</th>
                <th>Monto</th>
            </tr>
        </thead>
        <tbody id="cuerpo-buscar">
            <!-- Se llena dinámicamente con JS -->
        </tbody>
    </table>
</section>

    </main>

    <script src="script.js"></script>
</body>
</html>
