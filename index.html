<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos - Inicio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Menú Lateral -->
    <aside>
        <h2>Control de Gastos</h2>
        <ul>
            <li class="active"><a href="index.html">Inicio</a></li>
            <li><a href="movimientos.html">Movimientos</a></li>
            <li><a href="buscar.html">Buscar</a></li>
            <li><a href="resumen.html">Resumen</a></li>
        </ul>
    </aside>

    <!-- Contenido Principal -->
    <main>
        <header>
            <span>Hola, Usuario</span>
            <div>
                <button class="btn btn-ingreso">+ Registrar Ingreso</button>
                <button class="btn btn-gasto">- Registrar Gasto</button>
            </div>
        </header>

        <section class="tarjetas-container">
            <div class="card">
                <h3>Saldo Disponible</h3>
                <p class="monto">$ 3.450.800</p>
            </div>
            <div class="card">
                <h3>Ingresos</h3>
                <p class="monto texto-ingreso">$ 5.200.000</p>
            </div>
            <div class="card">
                <h3>Gastos</h3>
                <p class="monto texto-gasto">$ 1.749.000</p>
            </div>
        </section>

        <section>
            <h3>Movimientos Recientes</h3>
            <table>
                <thead>
                    <tr>
                        <th>Categoría</th>
                        <th>Fecha</th>
                        <th>Descripción</th>
                        <th>Monto</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Alimentación</td>
                        <td>2026-10-25</td>
                        <td>Almuerzo de trabajo</td>
                        <td class="texto-gasto">-$ 45.900</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
     
   <!-- Modal Formulario -->
<dialog id="modal-movimiento">
    <div class="modal-content">
        <h3>Nuevo Movimiento</h3>
        <form id="form-movimiento">
            <div class="form-group">
                <label for="tipo">Tipo de Transacción</label>
                <select id="tipo">
                    <option value="gasto">Gasto (-)</option>
                    <option value="ingreso">Ingreso (+)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="monto">Monto ($ COP)</label>


                <input type="number" id="monto" placeholder="Ej. 50000" min="1" max="10000000" required>
            </div>
            
            <div class="form-group">
                <label for="categoria">Categoría</label>
                <select id="categoria">
                    <!-- Se llena según el tipo -->
                </select>
            </div>
            
            <div class="form-group">
                <label for="fecha">Fecha</label>
                <input type="date" id="fecha" required>
            </div>
            
            <div class="form-group">
                <label for="descripcion">Descripción (opcional)</label>
                <input type="text" id="descripcion" placeholder="Ej. Detalle del pago">
            </div>

                <div class="modal-acciones">
                    <button type="button" class="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn btn-ingreso">Guardar</button>
                </div>
            </form>
        </div>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
