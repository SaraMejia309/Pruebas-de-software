<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Menú Lateral -->
    <aside>
        <h2>Control de Gastos</h2>
        <ul>
            <li>Inicio</li>
            <li>Movimientos</li>
            <li>Buscar</li>
            <li>Resumen</li>
        </ul>
    </aside>

    <!-- Contenido Principal -->
    <main>
        <header>
            <span>Hola, Usuario</span>
            <div>
                <button class="btn btn-ingreso">+ Registrar Ingreso</button>
                <button class="btn btn-gasto">- Registrar Gasto</button>
            </div>
        </header>

        <section class="tarjetas-container">
            <div class="card">
                <h3>Saldo Disponible</h3>
                <p class="monto">$ 3.450.800</p>
            </div>
            <div class="card">
                <h3>Ingresos</h3>
                <p class="monto texto-ingreso">$ 5.200.000</p>
            </div>
            <div class="card">
                <h3>Gastos</h3>
                <p class="monto texto-gasto">$ 1.749.000</p>
            </div>
        </section>

        <section>
            <h3>Movimientos Recientes</h3>
            <table>
                <thead>
                    <tr>
                        <th>Categoría</th>
                        <th>Fecha</th>
                        <th>Descripción</th>
                        <th>Monto</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Alimentación</td>
                        <td>2026-10-25</td>
                        <td>Almuerzo de trabajo</td>
                        <td class="texto-gasto">-$ 45.900</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- Modal Formulario -->
    <dialog id="modal-movimiento">
        <div class="modal-content">
            <h3>Nuevo Movimiento</h3>
            <form id="form-movimiento">
                <div class="form-group">
                    <label for="tipo">Tipo de Transacción</label>
                    <select id="tipo">
                        <option value="gasto">Gasto (-)</option>
                        <option value="ingreso">Ingreso (+)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="monto">Monto ($ COP)</label>
                    <input type="number" id="monto" placeholder="Ej. 50000" min="1" required>
                </div>
                <div class="form-group">
                    <label for="categoria">Categoría</label>
                    <select id="categoria">
                        <option value="Alimentación">Alimentación</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Vivienda">Vivienda</option>
                        <option value="Salario">Salario</option>
                        <option value="Gasto Hormiga">Gasto Hormiga</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" required>
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                
                </div class="form-group">
                <label for="descripcion">Descripción (opcional)</label>
                <input type="text" id="descripcion" placeholder="Ej. Almuerzo">

                <div class="modal-acciones">
                    <button type="button" class="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn btn-ingreso">Guardar</button>
                </div>
            </form>
        </div>
    </dialog>

    <script>
        const modal = document.getElementById('modal-movimiento');
        const btnIngreso = document.querySelector('.btn-ingreso');
        const btnGasto = document.querySelector('.btn-gasto');
        const btnCancelar = document.querySelector('.btn-cancelar');

        btnIngreso.addEventListener('click', () => modal.showModal());
        btnGasto.addEventListener('click', () => modal.showModal());
        btnCancelar.addEventListener('click', () => modal.close());
    </script>
</body>
</html>
